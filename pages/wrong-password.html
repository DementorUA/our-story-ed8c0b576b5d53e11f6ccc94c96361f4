<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#f7efea">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests">
  <title>403 — Секретная фраза не подошла</title>
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon-180.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <style>
    @font-face{font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;src:url("assets/fonts/inter-500.ttf") format("truetype")}
    *{box-sizing:border-box}
    html{min-height:100%}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:12px;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.98),transparent 28rem),radial-gradient(circle at 92% 18%,rgba(232,210,224,.48),transparent 34rem),radial-gradient(circle at 45% 100%,rgba(245,214,199,.52),transparent 38rem),#f7efea;color:#fff}
    .poster{position:relative;width:min(96vw,720px,calc((100svh - 24px) * .6667));filter:drop-shadow(0 28px 80px rgba(89,61,51,.18))}
    .poster img{display:block;width:100%;height:auto;border-radius:18px}
    .real-button{position:absolute;left:50%;top:85.55%;z-index:2;transform:translate(-50%,-50%);display:inline-flex;align-items:center;justify-content:center;width:31%;min-width:188px;min-height:42px;padding:10px 20px;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:linear-gradient(180deg,rgba(171,126,115,.98),rgba(143,99,91,.98));box-shadow:0 12px 30px rgba(98,66,60,.24),inset 0 1px 0 rgba(255,255,255,.24);color:#fff;text-decoration:none;font-size:clamp(.8rem,1.7vw,1rem);font-weight:500;line-height:1;white-space:nowrap}
    .real-button:hover{transform:translate(-50%,-53%);box-shadow:0 16px 38px rgba(98,66,60,.30),inset 0 1px 0 rgba(255,255,255,.28)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:520px){body{padding:8px}.poster{width:min(100%,calc((100svh - 16px) * .6667))}.poster img{border-radius:12px}.real-button{top:85.6%;min-width:160px;min-height:36px;padding:8px 15px;font-size:.78rem}}
  </style>
</head>
<body>
  <main class="poster" aria-labelledby="pageTitle">
    <img src="assets/images/errors/wrong-password-kitten.png" alt="Страница 403: грустный котёнок держит закрытый альбом OurStoryGallery">
    <h1 class="sr-only" id="pageTitle">Секретная фраза не подошла</h1>
    <p class="sr-only">Альбом всё ещё закрыт. Попробуйте ещё раз.</p>
    <a class="real-button" href="./">← Попробовать снова</a>
  </main>
</body>
</html>
